{{- if .Values.serviceAccount.create }}
# **This exists so the analyzer can reach the bucket with no secret in the cluster.**
#
# The daemon asks the AWS provider chain whenever no static pair is configured. On Kubernetes that
# chain finds IRSA (or GKE Workload Identity) through a token projected because THE POD'S
# SERVICEACCOUNT carries a role annotation. Without one, `bucket.existingSecret: ""` did not mean
# "use the cluster's identity" — it meant "fall back to whatever the NODE has", which is the
# posture a security review objects to, since every pod on that node shares it.
#
# Created by default and unannotated, which is a no-op for a deployment using a Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "infertap-analyzer.serviceAccountName" . }}
  labels:
    {{- include "infertap-analyzer.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The analyzer calls out to an object store and never consumes the Kubernetes API, so a token
# mounted into the pod would be a credential with no use and a blast radius if the pod were ever
# compromised. The cloud identity above is projected by a separate mechanism and is unaffected.
automountServiceAccountToken: false
{{- end }}
