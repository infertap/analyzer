apiVersion: v1
kind: Service
metadata:
  name: {{ include "infertap-analyzer.fullname" . }}
  labels:
    {{- include "infertap-analyzer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "infertap-analyzer.selectorLabels" . | nindent 4 }}
  ports:
    - name: console
      port: {{ .Values.service.consolePort }}
      targetPort: console
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
---
# The headless Service a StatefulSet requires for stable network identity. One pod, so it names
# exactly one thing — but the StatefulSet will not start without it.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "infertap-analyzer.fullname" . }}-headless
  labels:
    {{- include "infertap-analyzer.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "infertap-analyzer.selectorLabels" . | nindent 4 }}
  ports:
    - name: console
      port: {{ .Values.service.consolePort }}
      targetPort: console
