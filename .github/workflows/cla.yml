# The CLA gate: an external pull request is checked for a signature on CLA.md before it can
# merge, and the author is told how to sign. contributor-assistant (pinned by SHA) records
# signatures on the `cla-signatures` branch of THIS repository through the workflow's own
# GITHUB_TOKEN — no personal token, no remote repository. It runs in the base repository on
# pull_request_target, so a fork's pull request is checked with this repository's
# permissions and none of the fork's code runs here.
#
# Maintainers listed in `allowlist` and bot accounts are not asked to sign. The document
# URL is this repository's; the public cut re-points it at the public repository.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: the contributor licence agreement is signed
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/infertap/analyzer/blob/main/CLA.md
          branch: cla-signatures
          allowlist: fishercort,*[bot]
          custom-notsigned-prcomment: 'Thank you for the pull request. This repository accepts contributions under the [InferTap Contributor License Agreement](https://github.com/infertap/analyzer/blob/main/CLA.md). To accept it, comment on this pull request with exactly the sentence below; the check re-runs on its own.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'Every author on this pull request has signed the CLA. Thank you.'
